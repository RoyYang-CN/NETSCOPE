name: Weekly Box Office Scraper

on:
  # 允许手动触发 (方便测试)
  workflow_dispatch:
  # 定时触发：每周一 北京时间 10:00 (UTC 时间 02:00)
  schedule:
    - cron: '0 2 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装 wechatpy 及其加密库，还有爬虫依赖
        pip install requests beautifulsoup4 pandas wechatpy cryptography
        
    - name: Run Scraper (Generate HTML)
      # 运行爬虫脚本，默认模式会自动抓取上周数据并生成 box_office.html
      # 这里的 "box_office_scraper V2.py" 文件名最好改短点，比如 scraper.py
      # 假设你重命名为了 scraper.py
      run: python "box_office_scraper V2.py"
      env:
        # 如果需要 TMDb key 也可以配在 secrets 里
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        
    - name: Upload to WeChat (Create Draft)
      run: python wechat_uploader.py
      env:
        # 这里的 secrets 需要在 GitHub 仓库设置里配置
        WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
        WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
        
    - name: Upload Artifact (Backup)
      # 把生成的 HTML 存一份在 GitHub Actions 运行记录里，万一发失败了可以下载来看
      uses: actions/upload-artifact@v4
      with:
        name: weekly-report
        path: box_office.html
